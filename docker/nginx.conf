worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 32M;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    server {
        listen 80 default_server;
        server_name _;
        root /var/www/html/public;
        index index.php;

        # Güvenlik başlıkları
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # .env, .git, composer vs erişimini engelle
        location ~ /\.(env|git|htaccess|htpasswd) { deny all; return 404; }
        location ~ ^/(vendor|storage|database|config|app|tests|docker)/ { deny all; return 404; }
        location ~ ^/(composer\.(json|lock)|package\.json|phpunit\.xml)$ { deny all; return 404; }

        # Front controller
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Tema CSS'leri (public dışı — router.php üzerinden)
        location ~ ^/(themes)/ {
            try_files $uri /index.php?$query_string;
        }

        # PHP-FPM
        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_read_timeout 60s;
        }

        # Statik dosyalar cache
        location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri /index.php?$query_string;
        }
    }
}
