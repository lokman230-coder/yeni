# ÖRNEK — gerçek değerleri sealed-secrets veya vault ile yönet.
# kubectl create secret generic ahost-secrets --from-literal=APP_KEY=... --from-literal=DB_PASSWORD=...
apiVersion: v1
kind: Secret
metadata:
  name: ahost-secrets
  namespace: ahost
type: Opaque
stringData:
  APP_KEY: "REPLACE_WITH_64_HEX_CHARS"
  DB_PASSWORD: "REPLACE_ME"
  DB_ROOT_PASSWORD: "REPLACE_ROOT"
