apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ahost-db
  namespace: ahost
spec:
  serviceName: ahost-db
  replicas: 1
  selector:
    matchLabels: {app: ahost-db}
  template:
    metadata:
      labels: {app: ahost-db}
    spec:
      containers:
      - name: mariadb
        image: mariadb:10.11
        ports:
        - containerPort: 3306
        env:
        - name: MARIADB_ROOT_PASSWORD
          valueFrom: {secretKeyRef: {name: ahost-secrets, key: DB_ROOT_PASSWORD}}
        - name: MARIADB_DATABASE
          valueFrom: {configMapKeyRef: {name: ahost-config, key: DB_DATABASE}}
        - name: MARIADB_USER
          valueFrom: {configMapKeyRef: {name: ahost-config, key: DB_USERNAME}}
        - name: MARIADB_PASSWORD
          valueFrom: {secretKeyRef: {name: ahost-secrets, key: DB_PASSWORD}}
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
        resources:
          requests: {cpu: "500m", memory: "1Gi"}
          limits:   {cpu: "2", memory: "4Gi"}
        livenessProbe:
          exec:
            command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["healthcheck.sh", "--connect"]
          initialDelaySeconds: 15
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: ahost-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: ahost-db
  namespace: ahost
spec:
  clusterIP: None
  ports:
  - port: 3306
    targetPort: 3306
  selector:
    app: ahost-db
