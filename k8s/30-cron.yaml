# Ahost'ın cron:run komutu — her 1 dk çalışır, zamanı gelenleri tetikler
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ahost-cron
  namespace: ahost
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: cron
            image: ahost-one:latest
            command: ["php", "console", "cron:run"]
            envFrom:
            - configMapRef: {name: ahost-config}
            - secretRef:    {name: ahost-secrets}
            volumeMounts:
            - name: storage
              mountPath: /var/www/html/storage
            resources:
              requests: {cpu: "100m", memory: "256Mi"}
              limits:   {cpu: "500m", memory: "512Mi"}
          volumes:
          - name: storage
            persistentVolumeClaim: {claimName: ahost-storage}
---
# Mail queue işleyici — 30 sn'de bir
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ahost-mail-queue
  namespace: ahost
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: mail
            image: ahost-one:latest
            command: ["php", "console", "mail:queue"]
            envFrom:
            - configMapRef: {name: ahost-config}
            - secretRef:    {name: ahost-secrets}
          volumes: []
